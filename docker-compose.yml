name: cry044-review-room

services:
  review-ledger:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: review
      POSTGRES_USER: review
      POSTGRES_PASSWORD: review
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --dbname=review --username=review
      start_period: 5s
      interval: 4s
      timeout: 2s
      retries: 15
    volumes:
      - type: volume
        source: review-ledger-data
        target: /var/lib/postgresql/data
      - type: bind
        source: ./migrations
        target: /docker-entrypoint-initdb.d
        read_only: true
    networks:
      - review-room

  deliberation-api:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: on-failure:3
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://review:review@review-ledger:5432/review?sslmode=disable
      UPLOAD_DIR: /srv/review-exchange
      REQUEST_TIMEOUT: 5s
    ports:
      - target: 8080
        published: "8080"
        protocol: tcp
    depends_on:
      review-ledger:
        condition: service_healthy
        restart: true
    volumes:
      - type: volume
        source: review-exchange-files
        target: /srv/review-exchange
    networks:
      - review-room

networks:
  review-room:
    driver: bridge

volumes:
  review-ledger-data:
  review-exchange-files:
